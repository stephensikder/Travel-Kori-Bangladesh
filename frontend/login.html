
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Travel Kori Bangladesh</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            TK <span>Travel Kori</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#destinations">Districts</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <p class="section-label">WELCOME BACK</p>

            <h1>Login to Your Account</h1>

            <p>Continue your journey with Travel Kori Bangladesh.</p>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit" class="primary-btn">
                    Login
                </button>

                <p id="loginMessage" role="status"></p>
            </form>

            <p>
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>
        </div>
    </main>

    <footer>
        <p>© 2026 Travel Kori Bangladesh</p>
    </footer>

    <script src="auth.js"></script>
</body>
</html>
