
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | Travel Kori Bangladesh</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">
            TK <span>Travel Kori</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#destinations">Districts</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card">
            <p class="section-label">START YOUR JOURNEY</p>

            <h1>Create an Account</h1>

            <p>Join Travel Kori Bangladesh and explore the country.</p>

            <form id="signupForm">
                <label for="fullName">Full Name</label>
                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >

                <label for="signupEmail">Email Address</label>
                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >

                <label for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    minlength="8"
                    required
                >

                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Enter your password again"
                    minlength="8"
                    required
                >

                <button type="submit" class="primary-btn">
                    Create Account
                </button>

                <p id="signupMessage" role="status"></p>
            </form>

            <p>
                Already have an account?
                <a href="login.html">Login</a>
            </p>
        </div>
    </main>

    <footer>
        <p>© 2026 Travel Kori Bangladesh</p>
    </footer>

    <script src="auth.js"></script>
</body>
</html>
